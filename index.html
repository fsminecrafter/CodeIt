<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CodeIt IDE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

<style>
:root{
  --bg:#1e1e1e;
  --panel:#252526;
  --panel2:#2d2d2d;
  --border:#3c3c3c;
  --accent:#0e639c;
  --text:#d4d4d4;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui;
}

#menubar{
  background:var(--panel2);
  display:flex;
  gap:20px;
  padding:6px 10px;
  border-bottom:1px solid var(--border);
  font-family: "Google Sans", monospace;
}

.menu{ position:relative; cursor:pointer; }
.menu:hover{ color:white; }

.dropdown{
  display:none;
  position:absolute;
  top:100%;
  left:0;
  background:var(--panel);
  border:1px solid var(--border);
  min-width:200px;
  z-index:100;
}

.dropdown div{
  padding:8px;
  cursor:pointer;
}

.dropdown div:hover{ background:var(--accent); }

.menu.open .dropdown{ display:block; }

#main{ flex:1; display:flex; overflow:hidden; }

#sidebar{
  width:220px;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:8px;
  overflow:auto;
  font-family: "Google Sans", monospace;
}

#tabs{
  display:flex;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}

.tab{
  padding:8px 14px;
  cursor:pointer;
  border-right:1px solid var(--border);
  display:flex;
  gap:8px;
  align-items:center;
}

.tab.active{ background:var(--bg); }

#editorArea{
  flex:1;
  display:flex;
  flex-direction:column;
}

#editorWrap{ flex:1; }
.CodeMirror{ height:100%; }

#terminal{
  height:180px;
  background:black;
  color:#0f0;
  padding:10px;
  font-family:monospace;
  overflow:auto;
  resize:vertical;
  border-top:1px solid var(--border);
}

.fileItem{ cursor:pointer; padding:4px; }
.fileItem:hover{ background:var(--accent); }

.hidden{ display:none; }

.dialog{
  position:fixed;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  background:var(--panel);
  padding:20px;
  border:1px solid var(--border);
  z-index:200;
}
</style>
</head>

<body>

<div id="menubar">

  <div class="menu">File
    <div class="dropdown">
      <div id="newFile">New File</div>
      <div id="openFile">Open File</div>
      <div id="openFolder">Open Folder</div>
      <div id="saveAs">Save As</div>
      <div id="toggleAutosave">Auto save: OFF</div>
    </div>
  </div>

  <div class="menu">Edit
    <div class="dropdown">
      <div id="undo">Undo</div>
      <div id="redo">Redo</div>
      <div id="findReplace">Find & Replace</div>
      <div id="packageManager">Package Manager</div>
    </div>
  </div>

  <div class="menu">Python
    <div class="dropdown" id="pyVersions"></div>
  </div>

</div>

<div id="main">

  <div id="sidebar">
    <b>Files</b>
    <div id="fileList"></div>
  </div>

  <div id="editorArea">

    <div id="tabs"></div>

    <div id="editorWrap">
      <textarea id="editor"></textarea>
    </div>

    <div id="terminal"></div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

<script src="app.js"></script>
</body>
</html>

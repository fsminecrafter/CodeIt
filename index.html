<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeIt IDE</title>
<link rel="icon" href="favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

<!-- xterm.js -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"/>

<!-- CodeMirror -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

<style>
:root {
  --bg:     #1e1e1e;
  --panel:  #252526;
  --panel2: #2d2d2d;
  --border: #3c3c3c;
  --accent: #0e639c;
  --text:   #d4d4d4;
  --text2:  #888;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: 'Google Sans', system-ui, sans-serif;
  overflow: hidden;
}

/* ── Menu bar ── */
#menubar {
  background: var(--panel2);
  display: flex;
  gap: 4px;
  padding: 4px 8px;
  border-bottom: 1px solid var(--border);
  z-index: 200;
  flex-shrink: 0;
}

.menu {
  position: relative;
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 4px;
  user-select: none;
  font-size: 13px;
}
.menu:hover { background: rgba(255,255,255,0.08); }

.dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 2px);
  left: 0;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  min-width: 200px;
  z-index: 300;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  overflow: hidden;
}
.dropdown div {
  padding: 7px 14px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
}
.dropdown div:hover { background: var(--accent); color: white; }
.menu.open .dropdown { display: block; }

/* ── Main layout ── */
#main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── Sidebar ── */
#sidebar {
  width: 210px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 10px 6px;
  overflow-y: auto;
  flex-shrink: 0;
  font-size: 13px;
}
#sidebar b {
  display: block;
  padding: 0 6px 6px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text2);
}

.fileItem {
  padding: 5px 8px;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fileItem:hover  { background: rgba(255,255,255,0.06); }
.fileItem.active { background: var(--accent); color: white; }

/* ── Editor area ── */
#editorArea {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ── Tab bar ── */
#tabs {
  display: flex;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
  align-items: stretch;
}
#tabs::-webkit-scrollbar { display: none; }

.tab {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 12px;
  height: 36px;
  cursor: pointer;
  border-right: 1px solid var(--border);
  font-size: 13px;
  white-space: nowrap;
  flex-shrink: 0;
  user-select: none;
  transition: background 0.1s;
}
.tab:hover:not(.active) { background: rgba(255,255,255,0.05); }
.tab.active {
  background: var(--bg);
  border-bottom: 2px solid var(--accent);
  color: white;
}
.tab.dragging  { opacity: 0.4; }
.tab.drag-over { border-left: 2px solid var(--accent); }

.tabClose {
  color: var(--text2);
  font-size: 16px;
  line-height: 1;
  padding: 0 2px;
  border-radius: 3px;
}
.tabClose:hover { background: rgba(255,255,255,0.15); color: white; }

/* Run tab special styling */
.run-tab {
  gap: 8px;
  padding: 0 10px;
  background: var(--panel2);
}
.run-tab:hover { background: rgba(255,255,255,0.05); }
.run-tab.active { background: var(--bg); }

#langSelect {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 12px;
  cursor: pointer;
}

#runBtn {
  background: #1a7a1a;
  color: white;
  border: none;
  padding: 3px 12px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  font-weight: 500;
}
#runBtn:hover:not(:disabled) { background: #1f9c1f; }
#runBtn:disabled { opacity: 0.5; cursor: default; }

/* ── Editor wrap ── */
#editorWrap {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

.CodeMirror {
  height: 100% !important;
  font-family: 'Fira Code', Consolas, monospace !important;
  font-size: 14px !important;
}
.CodeMirror-scroll { height: 100%; }

/* ── Terminal ── */
#terminal {
  height: 200px;
  background: #1e1e1e;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  overflow: hidden;
}
#terminal .xterm { padding: 6px; }

/* ── Utilities ── */
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="menubar">
  <div class="menu">File
    <div class="dropdown">
      <div id="newFile">📄 New File</div>
      <div id="openFile">📂 Open File</div>
      <div id="openFolder">🗂 Open Folder</div>
      <div id="saveAs">💾 Save As</div>
      <div id="toggleAutosave">🔄 Auto save: OFF</div>
      <div id="packageProject">📦 Package as .zip</div>
    </div>
  </div>

  <div class="menu">Edit
    <div class="dropdown">
      <div id="undo">↩ Undo  <span style="float:right;color:#888">Ctrl+Z</span></div>
      <div id="redo">↪ Redo  <span style="float:right;color:#888">Ctrl+Y</span></div>
      <div id="findReplace">🔍 Find &amp; Replace</div>
      <div id="packageManager">🐍 Package Manager (pip)</div>
    </div>
  </div>

  <div class="menu">Python
    <div class="dropdown" id="pyVersions"></div>
  </div>

  <div class="menu">Info
    <div class="dropdown">
      <div id="about">ℹ About</div>
      <div id="support">🌐 Browser Support</div>
    </div>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <b>Explorer</b>
    <div id="fileList"></div>
  </div>

  <div id="editorArea">
    <div id="tabs"></div>

    <div id="editorWrap">
      <textarea id="editor"></textarea>
    </div>

    <div id="terminal"></div>
  </div>
</div>

<!-- xterm.js -->
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>

<!-- CodeMirror core + modes (load ONCE) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>

<script src="app.js"></script>
</body>
</html>

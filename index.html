<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CodeIt IDE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/xterm/css/xterm.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

<style>
:root{
  --bg:#1e1e1e;
  --panel:#252526;
  --panel2:#2d2d2d;
  --border:#3c3c3c;
  --accent:#0e639c;
  --text:#d4d4d4;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui;
  overflow:hidden;
}

#menubar{
  background:var(--panel2);
  display:flex;
  gap:20px;
  padding:6px 10px;
  border-bottom:1px solid var(--border);
  font-family:"Google Sans", monospace;
  z-index:200;
  flex-shrink:0;
}

.menu{ position:relative; cursor:pointer; user-select:none; }
.menu:hover{ color:white; }

.dropdown{
  display:none;
  position:absolute;
  top:100%;
  left:0;
  background:var(--panel);
  border:1px solid var(--border);
  min-width:200px;
  z-index:300;
}

.dropdown div{
  padding:8px 12px;
  cursor:pointer;
  white-space:nowrap;
}

.dropdown div:hover{ background:var(--accent); color:white; }

.menu.open .dropdown{ display:block; }

#main{
  flex:1;
  display:flex;
  overflow:hidden;
}

#sidebar{
  width:220px;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:8px;
  overflow:auto;
  font-family:"Google Sans", monospace;
  flex-shrink:0;
}

#sidebar b {
  display:block;
  margin-bottom:6px;
  color:#ccc;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:0.05em;
}

#editorArea{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-width:0;
}

#tabs{
  display:flex;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  overflow-x:auto;
  align-items:stretch;
}

.tab{
  padding:6px 14px;
  cursor:pointer;
  border-right:1px solid var(--border);
  display:flex;
  gap:6px;
  align-items:center;
  white-space:nowrap;
  font-size:13px;
  flex-shrink:0;
}

.tab.active{ background:var(--bg); border-bottom:2px solid var(--accent); }
.tab:hover:not(.active){ background:#2a2a2a; }

#editorWrap{
  flex:1;
  display:flex;
  overflow:hidden;
  min-height:0;
}

.editorPane{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.CodeMirror{
  height:100% !important;
  flex:1;
  font-size:14px;
  font-family:'Fira Code', 'Consolas', monospace;
}

.CodeMirror-scroll{ height:100%; }

#terminal{
  height:200px;
  min-height:100px;
  background:#1e1e1e;
  border-top:1px solid var(--border);
  flex-shrink:0;
  resize:vertical;
  overflow:hidden;
}

.fileItem{
  cursor:pointer;
  padding:4px 6px;
  border-radius:3px;
  font-size:13px;
}
.fileItem:hover{ background:var(--accent); color:white; }

.hidden{ display:none !important; }

#runTab select {
  margin-left:8px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  padding:2px 4px;
  border-radius:3px;
  font-size:12px;
}
</style>
</head>

<body>

<div id="menubar">

  <div class="menu">File
    <div class="dropdown">
      <div id="newFile">New File</div>
      <div id="openFile">Open File</div>
      <div id="openFolder">Open Folder</div>
      <div id="saveAs">Save As</div>
      <div id="toggleAutosave">Auto save: OFF</div>
    </div>
  </div>

  <div class="menu">Edit
    <div class="dropdown">
      <div id="undo">Undo</div>
      <div id="redo">Redo</div>
      <div id="findReplace">Find &amp; Replace</div>
      <div id="packageManager">Package Manager</div>
    </div>
  </div>

  <div class="menu">Python
    <div class="dropdown" id="pyVersions"></div>
  </div>

  <div class="menu">Info
    <div class="dropdown">
      <div id="about">About</div>
      <div id="support">Support</div>
    </div>
  </div>

</div>

<div id="main">

  <div id="sidebar">
    <b>Files</b>
    <div id="fileList"></div>
  </div>

  <div id="editorArea">

    <div id="tabs"></div>

    <div id="editorWrap" class="editorPane">
      <textarea id="editor"></textarea>
    </div>

    <div id="terminal"></div>

  </div>

</div>

<!-- xterm -->
<script src="https://unpkg.com/xterm/lib/xterm.js"></script>

<!-- CodeMirror (load ONCE, correct version) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

<script src="app.js"></script>
</body>
</html>

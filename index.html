<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pydiode IDE</title>

<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

<style>
:root{
  --bg:#1e1e1e;
  --panel:#252526;
  --panel2:#2d2d2d;
  --border:#3c3c3c;
  --accent:#0e639c;
  --text:#d4d4d4;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,Segoe UI,Roboto,sans-serif;
}

#toolbar{
  background:var(--panel2);
  padding:8px;
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:1px solid var(--border);
}

button{
  background:var(--accent);
  border:none;
  color:white;
  padding:6px 12px;
  border-radius:4px;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.1);
}

#main{
  flex:1;
  display:flex;
  overflow:hidden;
}

#sidebar{
  width:220px;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:10px;
  font-size:14px;
}

#tabs{
  display:flex;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}

.tab{
  padding:8px 14px;
  cursor:pointer;
  border-right:1px solid var(--border);
}

.tab.active{
  background:var(--bg);
  color:white;
}

#editorArea{
  flex:1;
  display:flex;
  flex-direction:column;
}

#editorWrap{
  flex:1;
}

.CodeMirror{
  height:100%;
  font-size:14px;
}

#terminal{
  height:180px;
  background:black;
  color:#0f0;
  padding:10px;
  font-family:monospace;
  overflow:auto;
  resize:vertical;
  border-top:1px solid var(--border);
}

.hidden{ display:none; }

</style>
</head>

<body>

<div id="toolbar">
  <button id="openFile">Open File</button>
  <button id="run">Run ▶</button>
  <button id="toggleTerm">Terminal</button>
</div>

<div id="main">

  <div id="sidebar">
    <b>Files</b>
    <div id="fileList"></div>
  </div>

  <div id="editorArea">

    <div id="tabs"></div>

    <div id="editorWrap">
      <textarea id="editor"></textarea>
    </div>

    <div id="terminal"></div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

<script src="app.js"></script>
</body>
</html>
